# Weekly dependency PRs into dev; CI checks each one (docs/ci-cd.md).
# Expo / React Native packages move together with the Expo SDK: upgrade those with
# `npx expo install --fix` (or an SDK upgrade), not one by one here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-*/*"
      - dependency-name: "@react-native/*"
      - dependency-name: nativewind
      - dependency-name: tailwindcss
      - dependency-name: typescript
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: sunday
